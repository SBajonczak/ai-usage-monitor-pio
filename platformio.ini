; AI Usage Monitor - Waveshare ESP32-S3 1.43 AMOLED (466 x 466)
; Framework matches the upstream Waveshare LVGL9 driver (Arduino Core 3.3.0)
[env:waveshare_143]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Iinclude

lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@^7.3.0
  knolleary/PubSubClient@2.8

extra_scripts = pre:scripts/fetch_waveshare.py
